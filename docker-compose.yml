version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: securecart_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-securecart_db}
      MYSQL_USER: ${DB_USERNAME:-securecart}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - securecart_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - securecart_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securecart_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-securecart_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-securecart}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-rootpassword}
      JWT_SECRET: ${JWT_SECRET:-4c5970337336763979244226452948404d635166546a576e5a72347537782141}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@securecart.com}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-AdminSecure@2026!}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - securecart_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securecart_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - securecart_network

networks:
  securecart_network:
    driver: bridge

volumes:
  securecart_mysql_data:
    driver: local
