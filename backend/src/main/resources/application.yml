server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: securecart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Custom Application Security & Business Configuration
app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@securecart.com}
    password: ${APP_ADMIN_PASSWORD:AdminSecure@2026!}
    first-name: ${APP_ADMIN_FIRST_NAME:System}
    last-name: ${APP_ADMIN_LAST_NAME:Administrator}
  jwt:
    secret: ${JWT_SECRET:4c5970337336763979244226452948404d635166546a576e5a72347537782141}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: ${JWT_ISSUER:SecureCart}
    audience: ${JWT_AUDIENCE:SecureCart-App}
    cookie-name: securecart_refresh_token
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: Lax
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  rate-limit:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-window-seconds: ${LOGIN_WINDOW_SECONDS:300} # 5 minutes

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Actuator (health endpoint for Railway healthchecks)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    defaults:
      enabled: true
